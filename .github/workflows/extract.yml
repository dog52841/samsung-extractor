name: Extract Samsung Partitions

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Stable Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Forces a stable version instead of experimental Python 3.14

      - name: Install Samfirm Engine
        run: |
          python -m pip install --upgrade pip
          pip install samfirm --break-system-packages
          sudo apt-get update && sudo apt-get install -y p7zip-full zip

      - name: Fetch Official Firmware via Samsung API
        run: |
          echo "Connecting directly to Samsung firmware delivery networks..."
          samfirm -m SM-A146B -r INS

      - name: Decrypt and Unpack Archive
        run: |
          echo "Locating downloaded zip archive..."
          ZIP_FILE=$(ls SM-A146B_*.zip 2>/dev/null)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Firmware download failed or could not be found!"
            exit 1
          fi
          
          echo "Unzipping primary firmware bundle..."
          unzip "$ZIP_FILE" || true
          rm -f "$ZIP_FILE"
          
          echo "Locating the primary AP archive block..."
          AP_FILE=$(ls AP_*.tar.md5 2>/dev/null || ls AP_*.tar 2>/dev/null)
          if [ -z "$AP_FILE" ]; then
            echo "ERROR: Could not find any file starting with AP_!"
            exit 1
          fi
          echo "Found active AP container target: $AP_FILE"
          
          echo "Surgically harvesting target images..."
          7z e "$AP_FILE" system.img product.img || tar -xvf "$AP_FILE" system.img product.img || true
          
      - name: Package Target Recovered Images
        run: |
          echo "Compressing extracted files into a compact bundle..."
          zip -9 recovery_images.zip system.img product.img

      - name: Generate Direct Output Download Link
        uses: actions/upload-artifact@v4
        with:
          name: Clean-Samsung-Factory-Images
          path: recovery_images.zip
          retention-days: 1
